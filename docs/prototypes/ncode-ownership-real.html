  }).join('');
  document.querySelectorAll('.item').forEach(it=>it.onclick=()=>{
    const a=it.dataset.a; cur=(cur===a)?'__ALL__':a; document.getElementById('sel').value=cur; render();});
  const total=DATA.accounts.reduce((s,a)=>s+a.owners,0);
  const selA=DATA.accounts.find(a=>a.name===cur);
  document.getElementById('kpi').innerHTML=
    `<div class="box"><b>${DATA.meta.account_count}</b><span>ACCOUNT</span></div>`+
    `<div class="box"><b>${total}</b><span>소유 owner(합)</span></div>`+
    (selA?`<div class="box"><b>${selA.owners}</b><span>${cur} owner</span></div><div class="box"><b>${selA.books.toLocaleString()}</b><span>${cur} book</span></div>`
        :`<div class="box"><b>${DATA.sections.length}</b><span>Section</span></div>`);
}
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target;
 if(t.classList&&t.classList.contains('cell')&&t.dataset.tip){tip.textContent=t.dataset.tip;tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';}
 else tip.style.opacity=0;});
const sel=document.getElementById('sel');
DATA.accounts.forEach(a=>{const o=document.createElement('option');o.value=a.name;o.textContent=`${a.name} (owner ${a.owners})`;sel.appendChild(o);});
sel.onchange=e=>{cur=e.target.value;render();};
render();
</script></body></html>
